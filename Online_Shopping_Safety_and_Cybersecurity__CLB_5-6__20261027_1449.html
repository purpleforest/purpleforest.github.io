        // --- 1. CONFIG & DATA ---

        // Settings

        const LLM_MODEL = "gemini-3.6-flash";
        
        // Data injected from JSON
        const dialogueData = [{"en":"I'm always a bit hesitant about buying things online, especially with all the news about data breaches.","cn":"我对在网上买东西总是有点犹豫，尤其是在看到那么多关于数据泄露的新闻之后。"},{"en":"I understand your concern.","cn":"我理解你的担忧。"},{"en":"Generally, online shopping is quite safe if you take a few precautions.","cn":"通常来说，如果你采取一些预防措施，网上购物是相当安全的。"},{"en":"What kind of precautions are we talking about?","cn":"我们说的是什么样的预防措施呢？"},{"en":"I worry about my credit card details.","cn":"我担心我的信用卡信息。"},{"en":"Well, first, always make sure the website address begins with 'https'.","cn":"嗯，首先，一定要确保网址是以 'https' 开头的。"},{"en":"Also, look for a padlock icon in your browser.","cn":"此外，还要在浏览器中寻找一个挂锁图标。"},{"en":"Right, I've heard that before.","cn":"对，我以前听说过这个。"},{"en":"Does that really make a big difference?","cn":"那真的有很大区别吗？"},{"en":"Absolutely.","cn":"当然了。"},{"en":"The 's' stands for 'secure,' meaning your information is encrypted when it's sent.","cn":"这个 's' 代表 '安全'（secure），意思是你的信息在发送时是经过加密的。"},{"en":"That makes sense.","cn":"原来是这样，有道理。"},{"en":"What about those emails that look like they're from a legitimate company but aren't?","cn":"那那些看起来像是来自合法公司但实际上不是的电子邮件是怎么回事呢？"},{"en":"Those are often phishing scams.","cn":"那些通常是网络钓鱼诈骗。"},{"en":"Never click on suspicious links or provide personal information if you're unsure.","cn":"如果你不确定，千万不要点击可疑链接或提供个人信息。"},{"en":"So, only shop on reputable sites and be wary of unsolicited emails?","cn":"所以，只在信誉良好的网站上购物，并且对不请自来的电子邮件保持警惕？"},{"en":"Exactly.","cn":"完全正确。"},{"en":"And consider using strong, unique passwords, maybe even two-factor authentication, for added security.","cn":"并且考虑使用高强度、独特的密码，甚至可以使用双重身份验证，以进一步增加安全性。"}];
        const knowledgePoints = [{"cat":"重点单词","point":"hesitant","cn":"犹豫的，踌躇的，不情愿的","ex":"She was hesitant to accept the job offer because it required a long commute.","exTrans":"她对是否接受这份工作邀请有些犹豫，因为通勤时间太长了。","ipa":""},{"cat":"实用短语","point":"data breach","cn":"数据泄露，资料外泄","ex":"The hospital had to notify thousands of patients after a serious data breach occurred.","exTrans":"在发生严重的数据泄露事件后，这家医院不得不通知数千名患者。","ipa":""},{"cat":"重点单词","point":"concern","cn":"担忧，顾虑；关切的事","ex":"Rising housing costs are a major concern for young families in the city.","exTrans":"不断上涨的住房成本是该市年轻家庭面临的主要担忧。","ipa":""},{"cat":"重点单词","point":"precaution","cn":"预防措施，防备","ex":"Remember to bring an umbrella just as a precaution against sudden rain.","exTrans":"记得带把伞，作为应对突然下雨的预防措施。","ipa":""},{"cat":"实用短语","point":"take precautions","cn":"采取预防措施","ex":"Hikers must take precautions when walking through areas where bears are active.","exTrans":"徒步旅行者在穿过熊类活动的区域时必须采取预防措施。","ipa":""},{"cat":"实用短语","point":"credit card details","cn":"信用卡详细信息（如卡号、有效期、安全码等）","ex":"Please do not write down your credit card details on a piece of paper.","exTrans":"请不要把你的信用卡详细信息写在纸上。","ipa":""},{"cat":"实用短语","point":"make sure","cn":"确保，确认，查明","ex":"Please make sure all the windows are locked before you leave the office.","exTrans":"在你离开办公室之前，请确保所有的窗户都已锁好。","ipa":""},{"cat":"重点单词","point":"padlock","cn":"挂锁","ex":"He bought a heavy metal padlock to secure his bicycle outside the station.","exTrans":"他买了一把沉重的金属挂锁，把自行车锁在车站外面。","ipa":""},{"cat":"重点单词","point":"browser","cn":"（互联网）浏览器","ex":"If the webpage is not loading properly, try clearing your browser cache.","exTrans":"如果网页无法正常加载，请尝试清除浏览器缓存。","ipa":""},{"cat":"典型句型","point":"make a big difference","cn":"产生很大影响，有很大区别，起重要作用","ex":"Getting just thirty minutes of exercise every day can make a big difference to your health.","exTrans":"每天只需锻炼三十分钟，就能对你的健康产生很大的影响。","ipa":""},{"cat":"日常俚语","point":"absolutely","cn":"当然，完全正确（用于强烈肯定的口语回应）","ex":"Do you think our team has a chance to win the championship? Absolutely!","exTrans":"你觉得我们队有机会赢得冠军吗？当然有！","ipa":""},{"cat":"实用短语","point":"stand for","cn":"代表，缩写为；主张","ex":"Does anyone in the class know what the letters 'VIP' stand for?","exTrans":"班里有人知道字母“VIP”代表什么吗？","ipa":""},{"cat":"重点单词","point":"secure","cn":"安全的，可靠的；安心的","ex":"Keep your passport in a secure place while you are traveling abroad.","exTrans":"在国外旅行时，请把护照放在安全的地方。","ipa":""},{"cat":"重点单词","point":"encrypt","cn":"将……加密，把……编码","ex":"Modern messaging apps automatically encrypt your chats so strangers cannot read them.","exTrans":"现代聊天应用程序会自动加密你的聊天记录，使陌生人无法读取。","ipa":""},{"cat":"日常俚语","point":"make sense","cn":"有道理，讲得通，合乎情理","ex":"It does not make sense to buy a car if you live right next to the subway station.","exTrans":"如果你就住在地铁站旁边，买车是不合情理的。","ipa":""},{"cat":"重点单词","point":"legitimate","cn":"合法的，正规的，真正的","ex":"The employee had a legitimate reason for arriving late to the morning meeting.","exTrans":"这位员工早会迟到是有正当理由的。","ipa":""},{"cat":"实用短语","point":"phishing scam","cn":"网络钓鱼诈骗（通过伪装成正规机构骗取个人信息的手段）","ex":"My grandfather almost lost his savings to a clever phishing scam over the weekend.","exTrans":"我祖父上周末差点因为一个高明的网络钓鱼诈骗而损失了他的积蓄。","ipa":""},{"cat":"重点单词","point":"suspicious","cn":"可疑的，令人怀疑的","ex":"The security guard noticed a suspicious package left unattended near the entrance.","exTrans":"保安注意到入口附近有一个无人看管的可疑包裹。","ipa":""},{"cat":"实用短语","point":"personal information","cn":"个人信息，个人资料","ex":"The form asks for basic personal information such as your date of birth and home address.","exTrans":"这张表格要求填写基本的个人信息，比如你的出生日期和家庭住址。","ipa":""},{"cat":"重点单词","point":"unsure","cn":"不确定的，没把握的","ex":"If you are unsure about how to operate the machine, please ask a supervisor.","exTrans":"如果你不确定如何操作这台机器，请询问主管。","ipa":""},{"cat":"重点单词","point":"reputable","cn":"信誉好的，有口碑的，值得信赖的","ex":"We hired a reputable contractor to renovate our kitchen and bathroom.","exTrans":"我们聘请了一家信誉良好的承包商来翻新我们的厨房和浴室。","ipa":""},{"cat":"实用短语","point":"be wary of","cn":"对……保持警惕，提防……","ex":"Tourists should be wary of people offering unofficial taxi rides at the airport.","exTrans":"游客在机场应该提防那些提供非正规出租车服务的人。","ipa":""},{"cat":"重点单词","point":"unsolicited","cn":"不请自来的，未经请求的（常指垃圾邮件或推销电话）","ex":"I am tired of receiving unsolicited phone calls trying to sell me insurance.","exTrans":"我厌倦了接到那些不请自来的推销保险的电话。","ipa":""},{"cat":"重点单词","point":"unique","cn":"独特的，独一无二的","ex":"Every person has a unique set of fingerprints that cannot be copied.","exTrans":"每个人都有一套无法复制的独一无二的指纹。","ipa":""},{"cat":"实用短语","point":"two-factor authentication","cn":"双重身份验证，两步验证","ex":"After enabling two-factor authentication, I must enter a code from my phone to log in.","exTrans":"启用双重身份验证后，我必须输入手机上的验证码才能登录。","ipa":""}];
        const cultureData = [{"en":"In North America, online shopping (e-commerce) is an integral part of daily life, with platforms like Amazon, Shopify-powered stores, and major retail websites dominating consumer habits. However, the high volume of digital transactions has also made consumers prime targets for cybercriminals. High-profile corporate data breaches frequently make national headlines, making privacy and identity theft a common topic of everyday conversation. As a result, government agencies (like the Canadian Centre for Cyber Security and the FTC in the US) and banks actively educate the public on digital hygiene. Terms like 'phishing,' 'two-factor authentication (2FA),' and 'encryption' have moved from technical IT jargon into everyday vocabulary. Consumers are generally expected to be proactive in protecting their own digital footprint, while credit card companies often provide 'zero-liability' fraud protection to reassure hesitant buyers.","cn":"在北美，网络购物（电子商务）是日常生活不可或缺的一部分，亚马逊、基于Shopify的独立网店以及各大零售商官网主导了消费者的购物习惯。然而，庞大的数字交易量也使普通消费者成为网络犯罪分子的首要目标。大型企业的数据泄露事件频繁登上国家新闻头条，这使得隐私保护和身份盗窃（Identity Theft）成为日常闲聊中的常见话题。因此，政府机构（如加拿大网络安全中心和美国联邦贸易委员会）以及各大银行都在积极向公众普及“数字卫生”（网络安全习惯）知识。像“网络钓鱼（phishing）”、“双重身份验证（2FA）”和“加密（encryption）”这样的词汇已经从专业的IT术语变成了日常词汇。社会普遍期望消费者能主动保护自己的数字足迹，同时信用卡公司通常也会提供“零责任（zero-liability）”防欺诈保护，以消除犹豫不决的买家的顾虑。"}]; // Fallback handled in logic

            const same = document.getElementById('use-same-key').checked;
            
            let geminiKey = geminiInput.value.trim();

            if (!geminiKey && !ttsKey) {

            if (geminiKey) {

            // --- FLASHCARDS ---
            // --- FLASHCARDS ---
            setCardMode(mode) {
                this.state.cardMode = mode;
                // Reset card index when switching modes
                this.state.cardIndex = 0;
                
                document.querySelectorAll('.mode-btn').forEach(b => {
                    // Match integer or string comparison safely
                    if(parseInt(b.dataset.mode) === mode) {
                        b.classList.remove('bg-gray-200', 'text-gray-700');
                        b.classList.add('bg-indigo-600', 'text-white');

                        b.classList.remove('bg-indigo-600', 'text-white');
                    }
                });
                this.updateCard();
            }
            
            getFlashcardData() {
                // Return Current List based on Mode
                // Mode 0: group_1 (EN -> CN)
                // Mode 1: group_2 (CN -> EN)
                // Mode 2: group_3 (Sent -> Trans)
                // Mode 3: group_4 (Trans -> Sent)
                if (flashcardsData) {
                    if (this.state.cardMode === 0) return flashcardsData.group_1 || [];
                    if (this.state.cardMode === 1) return flashcardsData.group_2 || [];
                    if (this.state.cardMode === 2) return flashcardsData.group_3 || [];
                    if (this.state.cardMode === 3) return flashcardsData.group_4 || [];
                    return [];
                }
                
                // Fallback: Generate from Knowledge Points (Legacy logic)
                return knowledgePoints.map(item => {
                   if (this.state.cardMode === 0) return { front: item.point, frontSub: item.cat, back: item.cn, backSub: item.ex };
                   if (this.state.cardMode === 1) return { front: item.cn, frontSub: item.cat, back: item.point, backSub: item.ipa }; 
                   if (this.state.cardMode === 2) return { front: item.ex, frontSub: "例句", back: item.exTrans, backSub: item.point };
                   if (this.state.cardMode === 3) return { front: item.exTrans, frontSub: "翻译", back: item.ex, backSub: item.point };
                   return {};
                });
            }
            
            updateCard() {
                const currentList = this.getFlashcardData();
                const item = currentList[this.state.cardIndex];
                
                if (!item) {
                     // Empty state
                     document.getElementById('card-counter').innerText = "0 / 0";
                     return;
                }
                
                document.getElementById('card-counter').innerText = `${this.state.cardIndex + 1} / ${currentList.length}`;
                
                // Front / Back Data
                // If using explicit flashcardsData, item has {front, back} keys.
                // We need to support "sub" text if available or auto-detect IPA? 
                // The example JSON puts IPA in the string: "skillet (n.) /.../"
                
                const front = document.getElementById('card-front-text');
                const frontSub = document.getElementById('card-front-sub');
                const back = document.getElementById('card-back-text');
                const backSub = document.getElementById('card-back-sub');
                
                // Reset flip
                document.querySelector('.card-container').classList.remove('flipped');
                
                // Render Logic
                if (flashcardsData) {
                     // Explicit JSON data
                     // Try to format: "Word (type) /ipa/" -> Word <br> (type) <br> /ipa/
                     // Matches: (Any text) followed by ( (..)) followed by ( /../)
                     const raw = item.front;
                     // Regex to split: Group 1: Word, Group 2: (type), Group 3: /ipa/
                     // This assumes the format "word (pos) /ipa/"
                     const match = raw.match(/^(.*?)\s+(\(.*\))\s+(\/.*\/)$/);
                     
                     if (match) {
                         front.innerHTML = `<div class="text-4xl mb-2">${match[1]}</div><div class="text-xl text-indigo-200">${match[2]}</div><div class="text-lg opacity-75 font-mono">${match[3]}</div>`;
                     } else {
                         // Try simplified: just word and type?
                         const match2 = raw.match(/^(.*?)\s+(\(.*\))$/);
                         if (match2) {
                             front.innerHTML = `<div class="text-4xl mb-2">${match2[1]}</div><div class="text-xl text-indigo-200">${match2[2]}</div>`;
                         } else {
                             // Fallback
                             front.innerText = raw;
                         }
                     }

                     frontSub.innerText = ""; // Cleared because we handled it above
                     
                     back.innerText = item.back;
                     backSub.innerText = ""; 
                } else {
                     // Legacy mapped data
                     front.innerText = item.front;
                     frontSub.innerText = item.frontSub;
                     back.innerText = item.back;
                     backSub.innerText = item.backSub;
                }
            }
            
            flipCard() { document.querySelector('.card-container').classList.toggle('flipped'); }
            nextCard() { 
                const list = this.getFlashcardData();
                if (this.state.cardIndex < list.length - 1) { this.state.cardIndex++; this.updateCard(); } 
                else { this.state.cardIndex = 0; this.updateCard(); } 
            }
            prevCard() { 
                const list = this.getFlashcardData();
                if (this.state.cardIndex > 0) { this.state.cardIndex--; this.updateCard(); } 
                else { this.state.cardIndex = list.length - 1; this.updateCard(); } 
            }
            
            playCardAudio(e, side) {
                e.stopPropagation();
                const list = this.getFlashcardData();
                const item = list[this.state.cardIndex];
                
                // Logic: Try to play simple text. 
                // If explicit data, we might need to extract the "word" from "word (n.) /ipa/"
                // Simple regex to take the first word or the whole thing?
                // Let's try whole string first. Smart TTS often handles mixed text okay, 
                // but "skillet (n.) /skɪlɪt/" might be read weirdly.
                // Better heuristic: Extract text before " (" or "/"
                
                let textToPlay = (side === 'front' ? item.front : item.back);
                
                // Clean up for TTS: remove (...) and /.../
                // Double escape backslashes for template literal generation
                textToPlay = textToPlay.replace(/\(.*\)/g, '').replace(/\/[^/]*\//g, '').trim();
                
                // Requirement: "Don't pronounce Chinese"
                // Detect Chinese char? 
                if (/[\u4e00-\u9fa5]/.test(textToPlay)) {
                    // Try the other side? Or just don't play?
                    // "Corresponding English pronunciation"
                    // If side is Chinese, we want the English.
                    // In group_2 (CN->EN), Front is CN, Back is EN. If clicked Front (CN), play Back (EN).
                    const otherText = (side === 'front' ? item.back : item.front);
                    const cleanOther = otherText.replace(/\(.*\)/g, '').replace(/\/[^/]*\//g, '').trim();
                     if (!/[\u4e00-\u9fa5]/.test(cleanOther)) {
                         textToPlay = cleanOther;
                     } else {
                         return; // Both might be Chinese? Unlikely in this app.
                     }
                }

                this.playAudio(textToPlay);
            }

            // --- AUDIO & AI ---
            async playAudio(text) {
                if(!text) return;
               
                if (this.state.audioCache.has(text)) {
                    this.playBlob(this.state.audioCache.get(text));
                    return;
                }

                if(!GOOGLE_TTS_KEY) { 
                     // Fallback to browser TTS if no key
                     console.warn("No Google TTS Key. Using Browser Fallback.");
                     const uttr = new SpeechSynthesisUtterance(text);
                     uttr.lang = TTS_LANG_CODE;
                     window.speechSynthesis.speak(uttr);
                     return; 
                }

                try {
                    const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_TTS_KEY}`;
                    let vName = TTS_VOICE_NAME;
                    if (vName.startsWith('multi_')) vName = vName.split('_')[1];
                    const payload = {
                        input: text.startsWith('<speak>') ? { ssml: text } : { text: text },
                        voice: { languageCode: TTS_LANG_CODE, name: vName },
                        audioConfig: { audioEncoding: "MP3" }
                    };
                    const response = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                    
                    if(!response.ok) throw new Error("TTS API Error");
                    
                    const data = await response.json();
                    if(data.audioContent) {
                        const blob = this.base64ToBlob(data.audioContent, 'audio/mp3');
                        const blobUrl = URL.createObjectURL(blob);
                        this.state.audioCache.set(text, blobUrl);
                        this.playBlob(blobUrl);
                    }
                } catch(e) { console.error(e); alert("TTS Error: " + e.message); }
            }
            
            playBlob(url) {
                const p = document.getElementById('audio-player');
                p.src = url;
                p.play();
            }

            async playFullAudio(source) {
                if (source === 'dialogue' && TTS_VOICE_NAME.startsWith('multi_')) {
                    const parts = TTS_VOICE_NAME.split('_');
                    let ssml = '<speak>';
                    dialogueData.forEach((d, i) => {
                        const v = (i % 2 === 0) ? parts[1] : parts[2];
                        const clean = (d.en || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        ssml += `<voice name="${v}">${clean}</voice> `;
                    });
                    ssml += '</speak>';
                    await this.playAudio(ssml);
                    return;
                }

                let text = "";
                if (source === 'dialogue') text = dialogueData.map(d => d.en).join(" ");
                else if (source === 'culture') text = cultureData.map(d => d.en).join(" ");
                
                await this.playAudio(text);
            }

            base64ToBlob(base64, type) {
                const byteChars = atob(base64);
                const byteNumbers = new Array(byteChars.length);
                for(let i=0; i<byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
                return new Blob([new Uint8Array(byteNumbers)], {type: type});
            }

            // --- AI GENERATION ---
            async generateNewQuestions(type) {
                if(!GOOGLE_LLM_KEY) { this.showError("Gemini API Key missing. Please check your extension settings and regenerate the page."); return; }
                const loader = document.getElementById('loading-modal');
                loader.classList.remove('hidden');

                try {
                    let prompt = "";
                    if (type === 'listening') {
                        prompt = `Based on this text: "${dialogueData.map(d => d.en).join(' ')}".Generate 10 NEW English listening questions in strictly valid JSON format. `;
                        prompt += `Types: "mc"(multiple choice), "tf"(true / false), "fill"(fill in blank), "dict"(dictation).Key names: type, q, options(for mc), ans(answer), srcText(for dictation target).Format: [{ "type": "mc", "q": "..", "options": ["A", "B"], "ans": "A" }]`;
                    } else {
                        const vocabItems = knowledgePoints.map(k => k.point + ' (' + k.cn + ')').join(", ");
                        prompt = `Strictly based on the following vocabulary list: ${vocabItems}.
Generate EXACTLY ${knowledgePoints.length} NEW English vocabulary test questions, ensuring there is exactly 1 question for each word/phrase in the list. Do not test other random words. The questions can test meanings, synonyms, or fill-in-the-blank usage.
Return strictly valid JSON array.
Types allowed: "mc" (multiple choice), "tf" (true/false), "fill" (fill in the blank).
Key names: type, q, options (for mc), ans.
Format: [{ "type": "mc", "q": "What is the meaning of X?", "options": ["A", "B", "C"], "ans": "A" }]`;
                    }

                    const jsonRes = await this.callLLM(prompt);
                    if (jsonRes && Array.isArray(jsonRes)) {
                        if (type === 'listening') {
                            listeningQuestions = jsonRes;
                            this.renderQuestions('listening-container', listeningQuestions, 'list');
                        } else {
                            vocabQuestions = jsonRes;
                            this.renderQuestions('vocab-test-container', vocabQuestions, 'vocab');
                        }
                        alert('New questions generated!');
                    } else {
                        throw new Error('Invalid JSON from AI');
                    }

                } catch(e) {
                    console.error(e);
                    this.showError(e.message);
                } finally {
                    loader.classList.add('hidden');
                }
            }

            showError(msg) {
                const modal = document.getElementById('error-modal');
                const content = document.getElementById('error-content');
                
                if (msg.includes("API has not been used") || msg.includes("is disabled")) {
                    content.innerHTML = `<p class="mb-4 text-red-600 font-bold">API Not Enabled</p>
                    <p class="mb-4">The Gemini API is not enabled for your project.</p>
                    <a href="https://console.developers.google.com/apis/library/generativelanguage.googleapis.com" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 block text-center">Enable Gemini API (Google Cloud)</a>
                    <p class="mt-4 text-xs text-gray-500">Enable it, wait 1-2 minutes, and try again.</p>`;
                } else {
                    content.textContent = "Error: " + msg;
                }
                modal.classList.remove('hidden');
            }

            async callLLM(prompt) {
                // Use configured Model
                if (GOOGLE_LLM_KEY) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${LLM_MODEL}:generateContent?key=${GOOGLE_LLM_KEY}`;
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || "Gemini API Error");
}

const data = await res.json();
let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
if (!text) throw new Error("No response from Gemini");
return this.parseJSON(text);
                }
throw new Error("No valid API Key");
            }

parseJSON(text) {
    text = text.replace(/\`\`\`json/g, '').replace(/\`\`\`/g, '').trim();
    return JSON.parse(text);
}

renderQuestions(containerId, questions, prefix) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = "bg-white p-6 rounded-lg border border-gray-200 shadow-sm question-block mb-4";

        let html = `<div class="mb-3 font-semibold text-lg flex items-start gap-2"><span class="bg-indigo-100 text-indigo-700 py-1 px-2 rounded-md text-sm mt-1">Q${i + 1}</span> <span>${q.q}</span></div>`;

                    if (q.type === 'dict' && q.srcText) {
                        html += `<button onclick="app.playAudio('${(q.srcText || '').replace(/'/g, "\\'")}')" class="mb-4 bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full hover:bg-yellow-200 transition flex items-center w-fit"><i class="fas fa-play mr-2"></i> 播放句子</button>`;
                    }
                    
                    html += '<div class="space-y-2 mt-2">';
                    if (q.type === 'mc') {
                        q.options.forEach(opt => {
                            html += `<div onclick="app.selectOption(this)" class="block p-3 rounded border hover:bg-indigo-50 hover:border-indigo-300 cursor-pointer transition select-option">${opt}</div>`;
                        });
                    } else if (q.type === 'tf') {
                        html += `<div class="flex gap-4"><button onclick="app.selectOption(this)" class="px-6 py-2 border rounded hover:bg-indigo-50 select-option">True</button><button onclick="app.selectOption(this)" class="px-6 py-2 border rounded hover:bg-indigo-50 select-option">False</button></div>`;
                    } else {
                        html += `<input type="text" placeholder="Your Answer..." class="w-full p-2 border rounded focus:border-indigo-500 outline-none user-ans-input">`;
                    }
                    html += `</div>
                    <div class="hidden mt-4 p-3 bg-gray-50 rounded text-sm text-green-700 font-bold answer-box">Answer: ${q.ans}</div>
                    `;
                    div.innerHTML = html;
                    container.appendChild(div);
                });
            }
            
            selectOption(el) {
                // Find siblings and remove active state
                const parent = el.parentElement;
                parent.querySelectorAll('.select-option').forEach(opt => {
                    opt.classList.remove('bg-indigo-100', 'border-indigo-500', 'text-indigo-900', 'selected');
                     opt.classList.add('hover:bg-indigo-50');
                });
                // Add active state
                el.classList.add('bg-indigo-100', 'border-indigo-500', 'text-indigo-900', 'selected');
                el.classList.remove('hover:bg-indigo-50');
                
                // Add basic validation visual (optional, or wait for check)
                // For now just select.
                
                // We also need to set the value for checking? 
                // Currently user-ans-input is for text. For MC/TF, we check class 'selected'?
                el.classList.add('user-selected');
            }

            checkAnswers(type) {
                const container = document.getElementById(type === 'listening' ? 'listening-container' : 'vocab-test-container');
                const blocks = container.querySelectorAll('.question-block');
                
                blocks.forEach(block => {
                     const ansBox = block.querySelector('.answer-box');
                     ansBox.classList.remove('hidden');
                     const correctAns = ansBox.textContent.split('Answer: ')[1].trim().toLowerCase();
                     
                     // Text input
                     const input = block.querySelector('input');
                     if(input) {
                         const val = input.value.trim().toLowerCase();
                         if(val === correctAns) { input.classList.add('border-green-500', 'bg-green-50'); }
                         else { input.classList.add('border-red-500', 'bg-red-50'); }
                     }
                     
                     // MC / TF Buttons
                     const selected = block.querySelector('.selected');
                     if(selected) {
                         const val = selected.textContent.trim().toLowerCase();
                         // Check if selected starts with "A. " or similar? Example options: "A. Word"
                         // Or "True"
                         // Usually answer key is "A" or "True".
                         
                         let match = false;
                         if (val === correctAns) match = true;
                         // Handle "A. Option" vs "A"
                         else if (val.startsWith(correctAns + ".") || val.startsWith(correctAns + " ")) match = true;
                         
                         if(match) {
                             selected.classList.add('bg-green-200', 'border-green-600');
                             selected.classList.remove('bg-indigo-100', 'border-indigo-500');
                         } else {
                             selected.classList.add('bg-red-200', 'border-red-600');
                             selected.classList.remove('bg-indigo-100', 'border-indigo-500');
                         }
                     }
                });
            }

        }

        const app = new EnglishApp();
    </script>
</body>
</html>
