    <script>
        window.onerror = function(msg, url, line, col, error) {
            alert("Error: " + msg + "\nLine: " + line);

            document.body.innerHTML += '<div style="color:red; background:white; padding:10px; border:1px solid red; margin:10px;">Javascript Error: ' + msg + ' (Line ' + line + ')</div>'; 
        };

        // --- 1. CONFIG & DATA ---
        // Separate Keys for better security/management
        // If Secure Mode was used, these will be empty strings.
        let GOOGLE_TTS_KEY = ""; 
        let GOOGLE_LLM_KEY = "";
        const OPENROUTER_KEY = "";
        
        // Settings
        const TTS_VOICE_NAME = "multi_en-US-Studio-O_en-US-Studio-M";
        const TTS_LANG_CODE = "en-US";
        const LLM_MODEL = "gemini-3.6-flash";
        
        // Data injected from JSON
        const dialogueData = [{"en":"So I just wanted to share how my English learning has been going recently.","cn":"我想分享一下我最近的英语学习情况。"},{"en":"I feel like I've made some progress, but there are still a few areas I really want to improve.","cn":"我觉得自己取得了一些进步，但仍有几个方面我非常想提高。"},{"en":"First, about my listening — I can tell it's getting better.","cn":"首先，关于我的听力——我能感觉到它在变好。"},{"en":"Your online lessons helped me a lot.","cn":"您的线上课程帮了我很大的忙。"},{"en":"When someone speaks slowly or clearly, I can usually understand the meaning.","cn":"当有人说话缓慢或清晰时，我通常能理解其中的意思。"},{"en":"I feel more comfortable following conversations now.","cn":"我现在跟上对话感觉更自在了。"},{"en":"But I still have some challenges.","cn":"但我仍然面临一些挑战。"},{"en":"When people speak quickly, or when the vocabulary is more advanced, I sometimes can't catch everything.","cn":"当人们语速很快，或者词汇比较高阶时，我有时无法听懂全部内容。"},{"en":"I might understand parts of the sentence but miss the key word, and then I lose the meaning.","cn":"我可能理解句子的某些部分，但错过了关键词，然后就听不懂整体意思了。"},{"en":"So my listening is improving, but I definitely need more practice with faster, more natural speech.","cn":"所以我的听力正在提高，但我肯定需要更多地练习更快、更自然的语流。"},{"en":"For speaking, I think the class really helps because I get to talk with other students.","cn":"在口语方面，我认为这门课很有帮助，因为我有机会和其他学生交谈。"},{"en":"That gives me more confidence.","cn":"这给了我更多的信心。"},{"en":"But I'm still not very fluent.","cn":"但我仍然不够流利。"},{"en":"Sometimes I have to stop and think about the right words.","cn":"有时候我必须停下来思考合适的词汇。"},{"en":"Sometimes I can't express exactly what I want to say.","cn":"有时候我无法准确表达我想说的话。"},{"en":"My words are usually very simple, and I wish I could be a little more precise.","cn":"我的用词通常非常简单，我希望自己能表达得更精确一些。"},{"en":"Sometimes, when I don't remember one word, I stop completely.","cn":"有时候，当我想不起某个词时，我就会完全卡住停下来。"},{"en":"I want to get better at continuing even when I don't know the perfect vocabulary.","cn":"我想提高在不知道完美词汇的情况下继续说下去的能力。"},{"en":"So for my next steps, I have two main goals.","cn":"所以对于接下来的步骤，我有两个主要目标。"},{"en":"One: I want to continue improving my listening, especially fast, everyday conversations.","cn":"第一：我想继续提高我的听力，尤其是快速的日常对话。"},{"en":"That is the kind of English people speak in real life, not just in textbooks.","cn":"那是人们在现实生活中说的英语，而不仅仅是课本里的英语。"},{"en":"Two: I want to speak more fluently.","cn":"第二：我想说得更流利。"},{"en":"I don't need to speak very fast, but I want to speak more smoothly, with fewer long pauses.","cn":"我不需要说得非常快，但我想说得更顺畅，减少长时间的停顿。"},{"en":"I also want to express myself more confidently.","cn":"我也想更自信地表达自己。"},{"en":"So overall, I'm happy with my progress, but I still have a lot to work on.","cn":"所以总的来说，我对自己的进步很满意，但我还有很多需要努力的地方。"},{"en":"And I'd really appreciate any suggestions you have for improving my listening and speaking.","cn":"如果您有任何关于提高我听力和口语的建议，我将非常感激。"}];
        const knowledgePoints = [{"cat":"实用短语","point":"make progress","cn":"取得进步，获得进展","ex":"With daily practice, you will definitely make progress in your pronunciation.","exTrans":"通过每天练习，你在发音方面一定会取得进步。","ipa":""},{"cat":"日常俚语","point":"can tell","cn":"能够看出，能感觉到，确切知道","ex":"I can tell that she has been practicing her presentation all week.","exTrans":"我能看出来她整个星期都在练习她的演讲。","ipa":""},{"cat":"实用短语","point":"follow a conversation","cn":"跟上对话，听懂谈话内容","ex":"It is difficult to follow a conversation in a noisy restaurant.","exTrans":"在嘈杂的餐厅里很难听清并跟上对话。","ipa":""},{"cat":"重点单词","point":"challenge","cn":"挑战，难题","ex":"Adapting to a new workplace culture can be a big challenge for newcomers.","exTrans":"适应新的职场文化对新移民来说可能是一个巨大的挑战。","ipa":""},{"cat":"重点单词","point":"advanced","cn":"高级的，高阶的，先进的","ex":"She decided to sign up for an advanced writing course this semester.","exTrans":"她决定这学期报名参加一门高阶写作课程。","ipa":""},{"cat":"日常俚语","point":"catch","cn":"听清，听懂，理解（某人说的话）","ex":"Sorry, I didn't quite catch your last name; could you spell it for me?","exTrans":"抱歉，我没太听清您的姓氏，您能帮我拼一下吗？","ipa":""},{"cat":"重点单词","point":"definitely","cn":"肯定地，毫无疑问地，明确地","ex":"Joining a local book club will definitely help you meet more people.","exTrans":"加入当地的读书俱乐部肯定会帮助你结识更多人。","ipa":""},{"cat":"实用短语","point":"get to do something","cn":"有机会做某事，得以做某事","ex":"During the workshop, participants get to ask the experts questions directly.","exTrans":"在研讨会期间，参与者有机会直接向专家提问。","ipa":""},{"cat":"重点单词","point":"confidence","cn":"自信，信心，把握","ex":"Passing the driving test on the first try gave him a lot of confidence.","exTrans":"第一次尝试就通过驾驶考试给了他很大的信心。","ipa":""},{"cat":"重点单词","point":"fluent","cn":"流利的，流畅的","ex":"After living in Montreal for three years, she became fluent in French.","exTrans":"在蒙特利尔生活了三年后，她的法语变得很流利。","ipa":""},{"cat":"重点单词","point":"express","cn":"表达，陈述，表露（思想或感情）","ex":"Art and music allow children to express their feelings creatively.","exTrans":"艺术和音乐让孩子们能够创造性地表达自己的情感。","ipa":""},{"cat":"重点单词","point":"precise","cn":"精确的，准确的，严谨的","ex":"The engineer gave very precise instructions on how to operate the machine.","exTrans":"工程师就如何操作这台机器给出了非常精确的说明。","ipa":""},{"cat":"典型句型","point":"I wish I could...","cn":"我希望我能够……（表达对改变现状的愿望）","ex":"I wish I could attend your graduation ceremony, but I have to work that day.","exTrans":"我希望我能参加你的毕业典礼，但那天我得上班。","ipa":""},{"cat":"实用短语","point":"get better at","cn":"在……方面变得更好，更擅长……","ex":"With patience and regular feedback, you will get better at public speaking.","exTrans":"只要有耐心并定期获得反馈，你会更擅长公开演讲。","ipa":""},{"cat":"重点单词","point":"smoothly","cn":"顺畅地，平稳地，顺利地","ex":"Thanks to careful planning, the community event went very smoothly.","exTrans":"由于周密的计划，这次社区活动进行得非常顺利。","ipa":""},{"cat":"重点单词","point":"pause","cn":"停顿，暂停","ex":"There was a brief pause in the conversation before he answered the question.","exTrans":"在他回答问题之前，谈话出现了短暂的停顿。","ipa":""},{"cat":"实用短语","point":"express oneself","cn":"表达自己的想法或感受","ex":"Learning synonyms helps you express yourself more clearly in writing.","exTrans":"学习同义词有助于你在写作中更清晰地表达自己。","ipa":""},{"cat":"重点单词","point":"overall","cn":"总的来说，总体上，大体上","ex":"There were a few minor issues, but overall the project was a great success.","exTrans":"虽然有几个小问题，但总的来说这个项目非常成功。","ipa":""},{"cat":"实用短语","point":"work on","cn":"致力于，努力改善，花时间研究","ex":"My coach told me that I need to work on my time management skills.","exTrans":"我的教练告诉我，我需要努力改善我的时间管理技能。","ipa":""},{"cat":"重点单词","point":"appreciate","cn":"感激，感谢，欣赏","ex":"We really appreciate all the hard work you put into organizing this meeting.","exTrans":"我们非常感谢你为组织这次会议所付出的全部辛勤努力。","ipa":""},{"cat":"重点单词","point":"suggestion","cn":"建议，提议","ex":"Do you have any suggestions for a good family restaurant in this neighborhood?","exTrans":"你对这附近好的家庭餐厅有什么建议吗？","ipa":""},{"cat":"典型句型","point":"I'd really appreciate...","cn":"我将非常感激……（用于礼貌地提出请求或征求意见）","ex":"I'd really appreciate it if you could review my resume before Friday.","exTrans":"如果您能在周五之前帮我看一下简历，我将非常感激。","ipa":""}];
        const cultureData = [{"en":"In North American language education, especially within the Canadian Language Benchmarks (CLB) framework and LINC (Language Instruction for Newcomers to Canada) programs, learner self-reflection and autonomous goal setting are highly valued. Teachers regularly encourage students to evaluate their own strengths and weaknesses in listening, speaking, reading, and writing. Rather than focusing solely on memorizing textbook grammar or achieving perfection, communicative competence emphasizes fluency, confidence, and practical strategies—such as paraphrasing or continuing to speak even when you forget a specific word. Sharing polite, structured feedback with an instructor and asking for targeted suggestions is a common and effective way for learners at the CLB 5-6 level to take ownership of their language journey.","cn":"在北美语言教育中，特别是在加拿大语言基准（CLB）框架和加拿大新移民语言培训（LINC）项目中，学习者的自我反思和自主目标设定受到高度重视。教师经常鼓励学生评估自己在听、说、读、写方面的优势与不足。交际能力教学法不仅关注死记硬背课本语法或追求完美，更强调流利度、自信心以及实用沟通策略——例如换一种方式表达，或者在忘记某个特定词汇时继续说下去。与老师分享礼貌、有条理的学习反馈并征求针对性建议，是CLB 5-6阶段学习者主动掌控自己语言学习进程的常见且有效的方式。"}]; // Fallback handled in logic

        let listeningQuestions = [{"type":"mc","q":"How does the speaker feel about their listening skills when people speak slowly and clearly?","options":["A. They still cannot catch the main idea.","B. They can usually understand the meaning.","C. They feel nervous and lose track of the conversation.","D. They need to look up every word in a dictionary."],"ans":"B. They can usually understand the meaning."},{"type":"mc","q":"What happens when the speaker misses a key word during a fast conversation?","options":["A. They ask the other person to write it down.","B. They guess the meaning immediately without any trouble.","C. They lose the meaning of the sentence.","D. They change the topic right away."],"ans":"C. They lose the meaning of the sentence."},{"type":"mc","q":"Why does the speaker think the class helps with their speaking skills?","options":["A. Because the teacher gives long grammar lectures.","B. Because they have to memorize textbook dialogues.","C. Because they get to talk with other students, which builds confidence.","D. Because there is no homework after class."],"ans":"C. Because they get to talk with other students, which builds confidence."},{"type":"mc","q":"What is one of the speaker's main goals for speaking in the next steps?","options":["A. To speak as fast as a native speaker.","B. To use only academic and complex words.","C. To speak more smoothly with fewer long pauses.","D. To avoid talking to strangers in real life."],"ans":"C. To speak more smoothly with fewer long pauses."},{"type":"tf","q":"The speaker feels completely fluent and never stops to think about words when speaking.","options":["True","False"],"ans":"False"},{"type":"tf","q":"When the speaker forgets a single word, they sometimes stop speaking completely.","options":["True","False"],"ans":"True"},{"type":"tf","q":"The speaker only wants to practice listening to slow textbook recordings rather than real-life conversations.","options":["True","False"],"ans":"False"},{"type":"fill","q":"My words are usually very simple, and I wish I could be a little more __________.","options":[],"ans":"precise"},{"type":"fill","q":"So overall, I'm happy with my progress, but I still have a lot to __________ on.","options":[],"ans":"work"},{"type":"fill","q":"When people speak quickly, or when the vocabulary is more __________, I sometimes can't catch everything.","options":[],"ans":"advanced"},{"type":"dict","q":"Listen and write down the exact sentence: 'I feel more comfortable following conversations now.'","options":[],"ans":"I feel more comfortable following conversations now.","srcText":"I feel more comfortable following conversations now."},{"type":"dict","q":"Listen and write down the exact sentence: 'And I'd really appreciate any suggestions you have for improving my listening and speaking.'","options":[],"ans":"And I'd really appreciate any suggestions you have for improving my listening and speaking.","srcText":"And I'd really appreciate any suggestions you have for improving my listening and speaking."}]; 
        let vocabQuestions = [{"type":"mc","q":"To bake a perfect cake, you need to be very __________ when measuring the flour and sugar.","options":["A. precise","B. fluent","C. overall","D. advanced"],"ans":"A. precise"},{"type":"fill","q":"The announcement at the train station was so quiet that nobody could __________ what the speaker said.","options":[],"ans":"catch"},{"type":"mc","q":"What does the phrasal verb 'work on' mean in the sentence 'He needs to work on his grammar'?","options":["A. To give up studying grammar completely.","B. To spend time and effort trying to improve his grammar.","C. To teach grammar at a local college.","D. To finish a grammar test in five minutes."],"ans":"B. To spend time and effort trying to improve his grammar."},{"type":"fill","q":"Balancing a full-time job and evening classes is a tough __________, but she handles it well.","options":[],"ans":"challenge"},{"type":"mc","q":"During the team meeting, Mark made a helpful __________ on how to reduce paper waste in the office.","options":["A. pause","B. confidence","C. suggestion","D. challenge"],"ans":"C. suggestion"},{"type":"tf","q":"If a student 'makes progress', it means their skills are getting worse over time.","options":["True","False"],"ans":"False"},{"type":"fill","q":"After we updated the software, the computer system started running much more __________.","options":[],"ans":"smoothly"},{"type":"mc","q":"Which sentence uses the phrase 'get to' to mean having a special opportunity to do something?","options":["A. How do you usually get to the library on weekends?","B. If we finish the project early, we get to leave the office at 3 p.m.","C. Please get to the point because we don't have much time.","D. What time did you get to sleep last night?"],"ans":"B. If we finish the project early, we get to leave the office at 3 p.m."},{"type":"fill","q":"Thank you for driving me to the airport; I really __________ your kindness and support.","options":[],"ans":"appreciate"},{"type":"mc","q":"Because Maria grew up in a bilingual household, she is completely __________ in both Spanish and English.","options":["A. precise","B. advanced","C. fluent","D. definite"],"ans":"C. fluent"},{"type":"tf","q":"To 'follow a conversation' means to walk physically behind two people who are talking on the street.","options":["True","False"],"ans":"False"},{"type":"mc","q":"Even with a limited vocabulary, body language and tone of voice can help you __________ effectively.","options":["A. make progress","B. express yourself","C. follow a conversation","D. work on"],"ans":"B. express yourself"},{"type":"fill","q":"That restaurant serves the best seafood in town; you should __________ try it this weekend.","options":[],"ans":"definitely"},{"type":"mc","q":"When writing a polite email to ask a colleague for feedback, which opening is the most natural?","options":["A. You must give me your feedback right now.","B. I'd really appreciate any feedback you can share on my draft.","C. I can tell you have some feedback for me.","D. I wish I could give you feedback."],"ans":"B. I'd really appreciate any feedback you can share on my draft."},{"type":"tf","q":"An 'advanced' course is designed for complete beginners who have never studied the subject before.","options":["True","False"],"ans":"False"},{"type":"fill","q":"The more you cook at home, the faster you will __________ preparing healthy meals.","options":[],"ans":"get better at"},{"type":"mc","q":"Practicing job interview questions with a friend is a great way to build your __________ before the real interview.","options":["A. pause","B. suggestion","C. confidence","D. challenge"],"ans":"C. confidence"},{"type":"fill","q":"The hotel room was a bit small, but __________ we enjoyed our vacation very much.","options":[],"ans":"overall"},{"type":"mc","q":"Look at the dark clouds in the sky; I __________ that it is going to rain heavily soon.","options":["A. can tell","B. work on","C. get to","D. catch"],"ans":"A. can tell"},{"type":"fill","q":"The speaker took a short __________ to drink some water before moving on to the next slide.","options":[],"ans":"pause"},{"type":"tf","q":"The verb 'express' means to hide your true thoughts so that nobody knows how you feel.","options":["True","False"],"ans":"False"},{"type":"fill","q":"__________ stay longer at the party, but I have to catch an early flight tomorrow morning.","options":[],"ans":"I wish I could"}];

        // --- RUNTIME KEY CHECK (Secure Mode) ---
        function checkRuntimeKeys() {
            if (!GOOGLE_TTS_KEY || !GOOGLE_LLM_KEY) {
                // Try LocalStorage
                // Load separately
                if (!GOOGLE_LLM_KEY) GOOGLE_LLM_KEY = localStorage.getItem('user_gemini_key') || '';
                if (!GOOGLE_TTS_KEY) GOOGLE_TTS_KEY = localStorage.getItem('user_tts_key') || '';
                
                // If still missing either, prompt
                if (!GOOGLE_TTS_KEY || !GOOGLE_LLM_KEY) {
                    showSettingsModal();
                }
            }
        }

                if(localStorage.getItem('user_tts_key')) document.getElementById('runtime-tts-key').value = localStorage.getItem('user_tts_key');

            } else {
                document.getElementById('settings-modal').classList.remove('hidden');

        window.toggleSameKey = function() {
            const same = document.getElementById('use-same-key').checked;
            const ttsInput = document.getElementById('runtime-tts-key');
            const geminiInput = document.getElementById('runtime-gemini-key');
            
            if (same) {
                ttsInput.value = geminiInput.value;
                ttsInput.disabled = true;
                ttsInput.classList.add('bg-gray-100');
            } else {
                ttsInput.disabled = false;
                ttsInput.classList.remove('bg-gray-100');
            }
        };

        window.saveRuntimeKey = function() {
            const geminiInput = document.getElementById('runtime-gemini-key');
            const ttsInput = document.getElementById('runtime-tts-key');
            const same = document.getElementById('use-same-key').checked;
            
            let geminiKey = geminiInput.value.trim();
            // If checking same key, ensure we copy it
            let ttsKey = same ? geminiKey : ttsInput.value.trim();
            
            if (!geminiKey && !ttsKey) {
                alert('Please enter at least one API Key.');
                return;
            }
            
            if (geminiKey) {
                localStorage.setItem('user_gemini_key', geminiKey);
                GOOGLE_LLM_KEY = geminiKey;
            }
            if (ttsKey) {
                localStorage.setItem('user_tts_key', ttsKey);
                GOOGLE_TTS_KEY = ttsKey;
            }
            
            document.getElementById('settings-modal').classList.add('hidden');
            alert('Keys saved successfully!');
        };

            // --- FLASHCARDS ---
            // --- FLASHCARDS ---
            setCardMode(mode) {
                this.state.cardMode = mode;
                // Reset card index when switching modes
                this.state.cardIndex = 0;
                
                document.querySelectorAll('.mode-btn').forEach(b => {
                    // Match integer or string comparison safely
                    if(parseInt(b.dataset.mode) === mode) {
                        b.classList.remove('bg-gray-200', 'text-gray-700');
                        b.classList.add('bg-indigo-600', 'text-white');
                    } else {
                        b.classList.add('bg-gray-200', 'text-gray-700');
                        b.classList.remove('bg-indigo-600', 'text-white');
                    }
                });
                this.updateCard();
            }
            
            getFlashcardData() {
                // Return Current List based on Mode
                // Mode 0: group_1 (EN -> CN)
                // Mode 1: group_2 (CN -> EN)
                // Mode 2: group_3 (Sent -> Trans)
                // Mode 3: group_4 (Trans -> Sent)
                if (flashcardsData) {
                    if (this.state.cardMode === 0) return flashcardsData.group_1 || [];
                    if (this.state.cardMode === 1) return flashcardsData.group_2 || [];
                    if (this.state.cardMode === 2) return flashcardsData.group_3 || [];
                    if (this.state.cardMode === 3) return flashcardsData.group_4 || [];
                    return [];
                }
                
                // Fallback: Generate from Knowledge Points (Legacy logic)
                return knowledgePoints.map(item => {
                   if (this.state.cardMode === 0) return { front: item.point, frontSub: item.cat, back: item.cn, backSub: item.ex };
                   if (this.state.cardMode === 1) return { front: item.cn, frontSub: item.cat, back: item.point, backSub: item.ipa }; 
                   if (this.state.cardMode === 2) return { front: item.ex, frontSub: "例句", back: item.exTrans, backSub: item.point };
                   if (this.state.cardMode === 3) return { front: item.exTrans, frontSub: "翻译", back: item.ex, backSub: item.point };
                   return {};
                });
            }
            
            updateCard() {
                const currentList = this.getFlashcardData();
                const item = currentList[this.state.cardIndex];
                
                if (!item) {
                     // Empty state
                     document.getElementById('card-counter').innerText = "0 / 0";
                     return;
                }
                
                document.getElementById('card-counter').innerText = `${this.state.cardIndex + 1} / ${currentList.length}`;
                
                // Front / Back Data
                // If using explicit flashcardsData, item has {front, back} keys.
                // We need to support "sub" text if available or auto-detect IPA? 
                // The example JSON puts IPA in the string: "skillet (n.) /.../"
                
                const front = document.getElementById('card-front-text');
                const frontSub = document.getElementById('card-front-sub');
                const back = document.getElementById('card-back-text');
                const backSub = document.getElementById('card-back-sub');
                
                // Reset flip
                document.querySelector('.card-container').classList.remove('flipped');
                
                // Render Logic
                if (flashcardsData) {
                     // Explicit JSON data
                     // Try to format: "Word (type) /ipa/" -> Word <br> (type) <br> /ipa/
                     // Matches: (Any text) followed by ( (..)) followed by ( /../)
                     const raw = item.front;
                     // Regex to split: Group 1: Word, Group 2: (type), Group 3: /ipa/
                     // This assumes the format "word (pos) /ipa/"
                     const match = raw.match(/^(.*?)\s+(\(.*\))\s+(\/.*\/)$/);
                     
                     if (match) {
                         front.innerHTML = `<div class="text-4xl mb-2">${match[1]}</div><div class="text-xl text-indigo-200">${match[2]}</div><div class="text-lg opacity-75 font-mono">${match[3]}</div>`;
                     } else {
                         // Try simplified: just word and type?
                         const match2 = raw.match(/^(.*?)\s+(\(.*\))$/);
                         if (match2) {
                             front.innerHTML = `<div class="text-4xl mb-2">${match2[1]}</div><div class="text-xl text-indigo-200">${match2[2]}</div>`;
                         } else {
                             // Fallback
                             front.innerText = raw;
                         }
                     }

                     frontSub.innerText = ""; // Cleared because we handled it above
                     
                     back.innerText = item.back;
                     backSub.innerText = ""; 
                } else {
                     // Legacy mapped data
                     front.innerText = item.front;
                     frontSub.innerText = item.frontSub;
                     back.innerText = item.back;
                     backSub.innerText = item.backSub;
                }
            }
            
            flipCard() { document.querySelector('.card-container').classList.toggle('flipped'); }
            nextCard() { 
                const list = this.getFlashcardData();
                if (this.state.cardIndex < list.length - 1) { this.state.cardIndex++; this.updateCard(); } 
                else { this.state.cardIndex = 0; this.updateCard(); } 
            }
            prevCard() { 
                const list = this.getFlashcardData();
                if (this.state.cardIndex > 0) { this.state.cardIndex--; this.updateCard(); } 
                else { this.state.cardIndex = list.length - 1; this.updateCard(); } 
            }
            
            playCardAudio(e, side) {
                e.stopPropagation();
                const list = this.getFlashcardData();
                const item = list[this.state.cardIndex];
                
                // Logic: Try to play simple text. 
                // If explicit data, we might need to extract the "word" from "word (n.) /ipa/"
                // Simple regex to take the first word or the whole thing?
                // Let's try whole string first. Smart TTS often handles mixed text okay, 
                // but "skillet (n.) /skɪlɪt/" might be read weirdly.
                // Better heuristic: Extract text before " (" or "/"
                
                let textToPlay = (side === 'front' ? item.front : item.back);
                
                // Clean up for TTS: remove (...) and /.../
                // Double escape backslashes for template literal generation
                textToPlay = textToPlay.replace(/\(.*\)/g, '').replace(/\/[^/]*\//g, '').trim();
                
                // Requirement: "Don't pronounce Chinese"
                // Detect Chinese char? 
                if (/[\u4e00-\u9fa5]/.test(textToPlay)) {
                    // Try the other side? Or just don't play?
                    // "Corresponding English pronunciation"
                    // If side is Chinese, we want the English.
                    // In group_2 (CN->EN), Front is CN, Back is EN. If clicked Front (CN), play Back (EN).
                    const otherText = (side === 'front' ? item.back : item.front);
                    const cleanOther = otherText.replace(/\(.*\)/g, '').replace(/\/[^/]*\//g, '').trim();
                     if (!/[\u4e00-\u9fa5]/.test(cleanOther)) {
                         textToPlay = cleanOther;
                     } else {
                         return; // Both might be Chinese? Unlikely in this app.
                     }
                }

                this.playAudio(textToPlay);
            }

            // --- AUDIO & AI ---
            async playAudio(text) {
                if(!text) return;
               
                if (this.state.audioCache.has(text)) {
                    this.playBlob(this.state.audioCache.get(text));
                    return;
                }

                if(!GOOGLE_TTS_KEY) { 
                     // Fallback to browser TTS if no key
                     console.warn("No Google TTS Key. Using Browser Fallback.");
                     const uttr = new SpeechSynthesisUtterance(text);
                     uttr.lang = TTS_LANG_CODE;
                     window.speechSynthesis.speak(uttr);
                     return; 
                }

                try {
                    const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${GOOGLE_TTS_KEY}`;
                    let vName = TTS_VOICE_NAME;
                    if (vName.startsWith('multi_')) vName = vName.split('_')[1];
                    const payload = {
                        input: text.startsWith('<speak>') ? { ssml: text } : { text: text },
                        voice: { languageCode: TTS_LANG_CODE, name: vName },
                        audioConfig: { audioEncoding: "MP3" }
                    };
                    const response = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
                    
                    if(!response.ok) throw new Error("TTS API Error");
                    
                    const data = await response.json();
                    if(data.audioContent) {
                        const blob = this.base64ToBlob(data.audioContent, 'audio/mp3');
                        const blobUrl = URL.createObjectURL(blob);
                        this.state.audioCache.set(text, blobUrl);
                        this.playBlob(blobUrl);
                    }
                } catch(e) { console.error(e); alert("TTS Error: " + e.message); }
            }
            
            playBlob(url) {
                const p = document.getElementById('audio-player');
                p.src = url;
                p.play();
            }

            async playFullAudio(source) {
                if (source === 'dialogue' && TTS_VOICE_NAME.startsWith('multi_')) {
                    const parts = TTS_VOICE_NAME.split('_');
                    let ssml = '<speak>';
                    dialogueData.forEach((d, i) => {
                        const v = (i % 2 === 0) ? parts[1] : parts[2];
                        const clean = (d.en || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        ssml += `<voice name="${v}">${clean}</voice> `;
                    });
                    ssml += '</speak>';
                    await this.playAudio(ssml);
                    return;
                }

                let text = "";
                if (source === 'dialogue') text = dialogueData.map(d => d.en).join(" ");
                else if (source === 'culture') text = cultureData.map(d => d.en).join(" ");
                
                await this.playAudio(text);
            }

            base64ToBlob(base64, type) {
                const byteChars = atob(base64);
                const byteNumbers = new Array(byteChars.length);
                for(let i=0; i<byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
                return new Blob([new Uint8Array(byteNumbers)], {type: type});
            }

            // --- AI GENERATION ---
            async generateNewQuestions(type) {
                if(!GOOGLE_LLM_KEY) { this.showError("Gemini API Key missing. Please check your extension settings and regenerate the page."); return; }
                const loader = document.getElementById('loading-modal');
                loader.classList.remove('hidden');

                try {
                    let prompt = "";
                    if (type === 'listening') {
                        prompt = `Based on this text: "${dialogueData.map(d => d.en).join(' ')}".Generate 10 NEW English listening questions in strictly valid JSON format. `;
                        prompt += `Types: "mc"(multiple choice), "tf"(true / false), "fill"(fill in blank), "dict"(dictation).Key names: type, q, options(for mc), ans(answer), srcText(for dictation target).Format: [{ "type": "mc", "q": "..", "options": ["A", "B"], "ans": "A" }]`;
                    } else {
                        const vocabItems = knowledgePoints.map(k => k.point + ' (' + k.cn + ')').join(", ");
                        prompt = `Strictly based on the following vocabulary list: ${vocabItems}.
Generate EXACTLY ${knowledgePoints.length} NEW English vocabulary test questions, ensuring there is exactly 1 question for each word/phrase in the list. Do not test other random words. The questions can test meanings, synonyms, or fill-in-the-blank usage.
Return strictly valid JSON array.
Types allowed: "mc" (multiple choice), "tf" (true/false), "fill" (fill in the blank).
Key names: type, q, options (for mc), ans.
Format: [{ "type": "mc", "q": "What is the meaning of X?", "options": ["A", "B", "C"], "ans": "A" }]`;
                    }

                    const jsonRes = await this.callLLM(prompt);
                    if (jsonRes && Array.isArray(jsonRes)) {
                        if (type === 'listening') {
                            listeningQuestions = jsonRes;
                            this.renderQuestions('listening-container', listeningQuestions, 'list');
                        } else {
                            vocabQuestions = jsonRes;
                            this.renderQuestions('vocab-test-container', vocabQuestions, 'vocab');
                        }
                        alert('New questions generated!');
                    } else {
                        throw new Error('Invalid JSON from AI');
                    }

                } catch(e) {
                    console.error(e);
                    this.showError(e.message);
                } finally {
                    loader.classList.add('hidden');
                }
            }

            showError(msg) {
                const modal = document.getElementById('error-modal');
                const content = document.getElementById('error-content');
                
                if (msg.includes("API has not been used") || msg.includes("is disabled")) {
                    content.innerHTML = `<p class="mb-4 text-red-600 font-bold">API Not Enabled</p>
                    <p class="mb-4">The Gemini API is not enabled for your project.</p>
                    <a href="https://console.developers.google.com/apis/library/generativelanguage.googleapis.com" target="_blank" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 block text-center">Enable Gemini API (Google Cloud)</a>
                    <p class="mt-4 text-xs text-gray-500">Enable it, wait 1-2 minutes, and try again.</p>`;
                } else {
                    content.textContent = "Error: " + msg;
                }
                modal.classList.remove('hidden');
            }

            async callLLM(prompt) {
                // Use configured Model
                if (GOOGLE_LLM_KEY) {
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${LLM_MODEL}:generateContent?key=${GOOGLE_LLM_KEY}`;
        const res = await fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });

if (!res.ok) {
    const err = await res.json();
    throw new Error(err.error?.message || "Gemini API Error");
}

const data = await res.json();
let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
if (!text) throw new Error("No response from Gemini");
return this.parseJSON(text);
                }
throw new Error("No valid API Key");
            }

parseJSON(text) {
    text = text.replace(/\`\`\`json/g, '').replace(/\`\`\`/g, '').trim();
    return JSON.parse(text);
}

renderQuestions(containerId, questions, prefix) {
    const container = document.getElementById(containerId);
    container.innerHTML = '';
    questions.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = "bg-white p-6 rounded-lg border border-gray-200 shadow-sm question-block mb-4";

        let html = `<div class="mb-3 font-semibold text-lg flex items-start gap-2"><span class="bg-indigo-100 text-indigo-700 py-1 px-2 rounded-md text-sm mt-1">Q${i + 1}</span> <span>${q.q}</span></div>`;

                    if (q.type === 'dict' && q.srcText) {
                        html += `<button onclick="app.playAudio('${(q.srcText || '').replace(/'/g, "\\'")}')" class="mb-4 bg-yellow-100 text-yellow-700 px-4 py-2 rounded-full hover:bg-yellow-200 transition flex items-center w-fit"><i class="fas fa-play mr-2"></i> 播放句子</button>`;
                    }
                    
                    html += '<div class="space-y-2 mt-2">';
                    if (q.type === 'mc') {
                        q.options.forEach(opt => {
                            html += `<div onclick="app.selectOption(this)" class="block p-3 rounded border hover:bg-indigo-50 hover:border-indigo-300 cursor-pointer transition select-option">${opt}</div>`;
                        });
                    } else if (q.type === 'tf') {
                        html += `<div class="flex gap-4"><button onclick="app.selectOption(this)" class="px-6 py-2 border rounded hover:bg-indigo-50 select-option">True</button><button onclick="app.selectOption(this)" class="px-6 py-2 border rounded hover:bg-indigo-50 select-option">False</button></div>`;
                    } else {
                        html += `<input type="text" placeholder="Your Answer..." class="w-full p-2 border rounded focus:border-indigo-500 outline-none user-ans-input">`;
                    }
                    html += `</div>
                    <div class="hidden mt-4 p-3 bg-gray-50 rounded text-sm text-green-700 font-bold answer-box">Answer: ${q.ans}</div>
                    `;
                    div.innerHTML = html;
                    container.appendChild(div);
                });
            }
            
            selectOption(el) {
                // Find siblings and remove active state
                const parent = el.parentElement;
                parent.querySelectorAll('.select-option').forEach(opt => {
                    opt.classList.remove('bg-indigo-100', 'border-indigo-500', 'text-indigo-900', 'selected');
                     opt.classList.add('hover:bg-indigo-50');
                });
                // Add active state
                el.classList.add('bg-indigo-100', 'border-indigo-500', 'text-indigo-900', 'selected');
                el.classList.remove('hover:bg-indigo-50');
                
                // Add basic validation visual (optional, or wait for check)
                // For now just select.
                
                // We also need to set the value for checking? 
                // Currently user-ans-input is for text. For MC/TF, we check class 'selected'?
                el.classList.add('user-selected');
            }

            checkAnswers(type) {
                const container = document.getElementById(type === 'listening' ? 'listening-container' : 'vocab-test-container');
                const blocks = container.querySelectorAll('.question-block');
                
                blocks.forEach(block => {
                     const ansBox = block.querySelector('.answer-box');
                     ansBox.classList.remove('hidden');
                     const correctAns = ansBox.textContent.split('Answer: ')[1].trim().toLowerCase();
                     
                     // Text input
                     const input = block.querySelector('input');
                     if(input) {
                         const val = input.value.trim().toLowerCase();
                         if(val === correctAns) { input.classList.add('border-green-500', 'bg-green-50'); }
                         else { input.classList.add('border-red-500', 'bg-red-50'); }
                     }
                     
                     // MC / TF Buttons
                     const selected = block.querySelector('.selected');
                     if(selected) {
                         const val = selected.textContent.trim().toLowerCase();
                         // Check if selected starts with "A. " or similar? Example options: "A. Word"
                         // Or "True"
                         // Usually answer key is "A" or "True".
                         
                         let match = false;
                         if (val === correctAns) match = true;
                         // Handle "A. Option" vs "A"
                         else if (val.startsWith(correctAns + ".") || val.startsWith(correctAns + " ")) match = true;
                         
                         if(match) {
                             selected.classList.add('bg-green-200', 'border-green-600');
                             selected.classList.remove('bg-indigo-100', 'border-indigo-500');
                         } else {
                             selected.classList.add('bg-red-200', 'border-red-600');
                             selected.classList.remove('bg-indigo-100', 'border-indigo-500');
                         }
                     }
                });
            }

        }

        const app = new EnglishApp();
    </script>
</body>
</html>
